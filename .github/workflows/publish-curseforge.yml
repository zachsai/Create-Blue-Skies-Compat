name: Publish to CurseForge
# Manual trigger only; requires the CURSEFORGE_TOKEN repository secret.
# Dispatch against the release branch you want to publish:
#   gh workflow run publish-curseforge.yml --ref forge-1.20.1
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17   # Matches the mod toolchain; also within Gradle 7.6/8.1 host support
      - name: Build and publish
        run: ./gradlew build publishCurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
